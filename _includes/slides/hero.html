<div class="hero {% if include.image %}hero--has-image{% endif %} {{ include.slide-class }}">
  <div class="inner">
    <h1 class="head mb">{{ include.headline }}</h1>
    <h3 class="subhead muted mb-lg">{{ include.subhead }}</h3>

    <a href="{{ include.cta-link }}" class="button">{{ include.button }}</a>
  </div>
  {% if include.image %}
    <div class="bg" style="background-image: url('{{ site.baseurl }}/img/{{ include.image }}');">&nbsp;</div>
  {% endif %}
</div>
